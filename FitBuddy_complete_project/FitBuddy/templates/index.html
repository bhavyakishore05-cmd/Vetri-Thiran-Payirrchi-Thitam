{% extends "base.html" %}
{% block content %}
<section class="hero">
<div><span class="badge">AI FITNESS PLANNER</span>
<h1>Your 7-day plan, built around your goal.</h1>
<p>Enter a few details and FitBuddy creates a structured workout plan plus a practical nutrition or recovery tip.</p></div>
<form class="card" action="/generate-workout" method="post">
<h2>Create your plan</h2>
<div class="grid">
<label>Name<input name="name" required minlength="2" placeholder="Your name"></label>
<label>User ID<input name="user_id" required pattern="[A-Za-z0-9_-]+" placeholder="user001"></label>
<label>Age<input type="number" name="age" required min="13" max="100" placeholder="20"></label>
<label>Weight (kg)<input type="number" name="weight" required min="1" max="500" step="0.1" placeholder="60"></label>
<label>Fitness goal<select name="goal"><option value="weight loss">Weight loss</option><option value="muscle gain">Muscle gain</option><option value="general wellness" selected>General wellness</option><option value="flexibility">Flexibility</option></select></label>
<label>Workout intensity<select name="intensity"><option value="low">Low</option><option value="medium" selected>Medium</option><option value="high">High</option></select></label>
</div>
<button class="primary" type="submit">Generate 7-day plan</button>
</form></section>
{% endblock %}
